<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Orbit Observers intro</title>
<style>
  @font-face{font-family:"JuraM";src:url("Jura-Medium.ttf")}
  @font-face{font-family:"JuraL";src:url("Jura-Light.ttf")}
  @font-face{font-family:"Mono";src:url("DMMono-Regular.ttf")}
  html,body{margin:0;background:#05070c;overflow:hidden}
  #stage{position:relative;width:1920px;height:1080px;background:#05070c;overflow:hidden;color:#dfe8f5}
  svg{position:absolute;left:0;top:0}
  .mono{font-family:"Mono",monospace}
  #hdr{position:absolute;font-family:"JuraL";font-size:46px;color:#dfe8f5;letter-spacing:.02em;white-space:nowrap}
  .card{position:absolute;width:318px;height:352px;border:1.5px solid #243651;border-radius:4px;box-sizing:border-box;padding:24px 24px;background:rgba(7,12,22,.9)}
  .card .k{font-family:"Mono";font-size:17px;color:#6f86a8}
  .card h3{margin:12px 0 8px;font-family:"JuraM";font-weight:500;font-size:34px;color:#5ad1ff;letter-spacing:.01em}
  .card p{margin:0;font-family:"JuraL";font-size:24px;line-height:1.25;color:#cfdbee}
  #cap,#tag,#foot,#clock{position:absolute;font-family:"Mono"}
</style></head><body>
<div id="stage">
  <svg id="bg" width="1920" height="1080"></svg>
  <svg id="art" width="1920" height="1080"></svg>
  <div id="hdr">What we are building</div>
  <div id="cards"></div>
  <svg id="fx" width="1920" height="1080"></svg>
  <div id="cap" style="left:77px;right:77px;top:800px;text-align:center;font-size:25px;color:#cfdbee;white-space:nowrap"><span style="color:#6f86a8">at 3°/s tumble, terminal window met in the model:</span> &nbsp;<b style="font-weight:400;color:#ff8f8f">41.6%</b> unprepared &nbsp;/&nbsp; <b style="font-weight:400;color:#ffb454">91.8%</b> markers &nbsp;/&nbsp; <b style="font-weight:400;color:#7dffb2">100%</b> marker + rate beacon</div>
  <div id="tag" style="left:0;right:0;top:830px;text-align:center;font-size:30px;color:#dfe8f5;letter-spacing:.04em">minimum preparation &nbsp;&nbsp;/&nbsp;&nbsp; safe when degraded &nbsp;&nbsp;/&nbsp;&nbsp; scalable roadmap</div>
  <div id="foot" style="left:0;right:0;top:1020px;text-align:center;font-size:17px;color:#566d8f">model-based study, assumed parameters, simulated demo data, not flight-qualified</div>
  <div id="clock" style="left:77px;top:1020px;font-size:20px;color:#6f86a8">T+00:00.0</div>
</div>
<script>
const NS="http://www.w3.org/2000/svg", $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E3=x=>1-Math.pow(1-clamp(x),3), EIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const seg=(t,a,b)=>E3((t-a)/(b-a)), segIO=(t,a,b)=>EIO((t-a)/(b-a)), lin=(t,a,b)=>clamp((t-a)/(b-a));
const mk=(p,tag,at,txt)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e};
const PALE="#dfe8f5", CY="#5ad1ff", AM="#ffb454", GR="#7dffb2", INK="#05070c";

// ---------- background: deterministic stars + a hairline reference grid ----------
const bg=$("bg"); let s=7; const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
const stars=[]; for(let i=0;i<110;i++){stars.push({x:rnd()*1920,y:rnd()*1080,r:.6+rnd()*1.3,p:rnd()*6.28,el:mk(bg,"circle",{r:1,fill:"#9db6d8"})})}
stars.forEach(o=>{o.el.setAttribute("cx",o.x);o.el.setAttribute("cy",o.y)});

// ---------- measure type, then build the lockup ----------
const art=$("art"); const FS=210;
const cv=document.createElement("canvas").getContext("2d"); cv.font=`${FS}px JuraM`;
const CAP=cv.measureText("H").actualBoundingBoxAscent;           // cap height in px at FS
const adv=ch=>cv.measureText(ch).width;
const STROKE=7, GAP=CAP*0.42, WING=CAP*0.62, WINGGAP=CAP*0.10;
const L1="RBIT", L2="BSERVERS";
const LH=CAP*2+GAP;
let x1=CAP+CAP*0.07; const l1=[...L1].map(ch=>{const o={ch,x:x1};x1+=adv(ch)+FS*0.045;return o});
const O2X0=WING+WINGGAP;                                           // satellite body starts after the left wing
let x2=CAP+WING+WINGGAP+CAP*0.04; const l2=[...L2].map(ch=>{const o={ch,x:x2};x2+=adv(ch)+FS*0.045;return o});
const W=Math.max(x1,x2), SHIFT=WING+WINGGAP;                        // local origin shift so left wing is inside the box
const lock=mk(art,"g",{});
const o1c={x:SHIFT+CAP/2+0, y:CAP/2}, o2c={x:SHIFT+O2X0-SHIFT+CAP/2, y:CAP+GAP+CAP/2};
// letters
const letters=[]; const addL=(arr,baseY,sx)=>arr.forEach(o=>{const el=mk(lock,"text",{x:SHIFT+ (sx? o.x : o.x), y:baseY,"font-family":"JuraM","font-size":FS,fill:PALE},o.ch);letters.push({el,x:SHIFT+o.x,y:baseY});});
addL(l1,CAP,false); addL(l2,CAP+GAP+CAP,true);
// O1: orbit ring with a satellite riding it
const ring1=mk(lock,"circle",{cx:o1c.x,cy:o1c.y,r:CAP/2-STROKE/2,fill:"none",stroke:PALE,"stroke-width":STROKE});
const sat1=mk(lock,"g",{}); const mkSat=(g,sc)=>{mk(g,"rect",{x:-9*sc,y:-3*sc,width:6*sc,height:6*sc,fill:"none",stroke:AM,"stroke-width":1.6*sc});mk(g,"rect",{x:3*sc,y:-3*sc,width:6*sc,height:6*sc,fill:"none",stroke:AM,"stroke-width":1.6*sc});mk(g,"rect",{x:-3*sc,y:-3*sc,width:6*sc,height:6*sc,fill:AM})};
mkSat(sat1,2.2);
// O2: a satellite - ring body, two solar wings, rocking
const o2=mk(lock,"g",{}); const bc={x:SHIFT+CAP/2+0, y:CAP+GAP+CAP/2};
const body=mk(o2,"g",{}); const BR=CAP/2-STROKE/2;
mk(body,"circle",{cx:0,cy:0,r:BR,fill:"none",stroke:PALE,"stroke-width":STROKE});
mk(body,"circle",{cx:0,cy:0,r:BR*0.22,fill:"none",stroke:CY,"stroke-width":3});           // optic
const wings=[]; [-1,1].forEach(sd=>{const w=mk(body,"g",{}); const x0=sd*(BR+STROKE/2+WINGGAP*0.5), pw=WING-WINGGAP*0.5, ph=CAP*0.34;
  const rx=sd<0?x0-pw:x0; mk(w,"line",{x1:sd*BR,y1:0,x2:x0,y2:0,stroke:PALE,"stroke-width":3});
  mk(w,"rect",{x:rx,y:-ph/2,width:pw,height:ph,fill:"none",stroke:PALE,"stroke-width":3});
  for(let i=1;i<4;i++)mk(w,"line",{x1:rx+pw*i/4,y1:-ph/2,x2:rx+pw*i/4,y2:ph/2,stroke:CY,"stroke-width":1.4,opacity:.8});
  mk(w,"line",{x1:rx,y1:0,x2:rx+pw,y2:0,stroke:CY,"stroke-width":1.4,opacity:.8}); wings.push({w,sd})});
// the ring that draws first, then becomes O1
const flyRing=mk(art,"ellipse",{fill:"none",stroke:CY,"stroke-width":2,"stroke-dasharray":"1 0"});
const flySat=mk(art,"g",{}); mkSat(flySat,2.6);
// reference marks near the wordmark
const refs=mk(art,"g",{opacity:0}); 

// ---------- flow: orbit arc, stations, cards ----------
const STAGES=[
 {k:"01",h:"Prepare",p:"Markers, a beacon and an IOS mode on the client",icon:"prep"},
 {k:"02",h:"Simulate",p:"35,100 paired Monte Carlo runs on HPC",icon:"mc"},
 {k:"03",h:"Couple",p:"IOS handover and abort follow the approach",icon:"ios"},
 {k:"04",h:"Operate",p:"AI agents, human approvals, audited",icon:"ops"},
 {k:"05",h:"Measure",p:"On-board logs, downlink and fuel gauging",icon:"meas"}];
const X0=77, GAPX=362, TOP=400, cards=$("cards"), fx=$("fx");
STAGES.forEach((st,i)=>{const d=document.createElement("div");d.className="card";d.style.left=(X0+i*GAPX)+"px";d.style.top=TOP+"px";
  d.innerHTML=`<div class="k">${st.k}</div><svg style="position:static" width="270" height="118" id="ic${i}"></svg><h3>${st.h}</h3><p>${st.p}</p>`;cards.appendChild(d);st.el=d;st.svg=d.querySelector("svg")});
const nodeX=i=>X0+159+i*GAPX, ARC=(u)=>{const x0=nodeX(0)-90,x1=nodeX(4)+90,xm=(x0+x1)/2; const px=x0+(x1-x0)*u; const py=330-120*(1-Math.pow(2*u-1,2)); return [px,py]};
const arcD=(()=>{let d="";for(let k=0;k<=60;k++){const [x,y]=ARC(k/60);d+=(k?"L":"M")+x.toFixed(1)+","+y.toFixed(1)}return d})();
const arc=mk(fx,"path",{d:arcD,fill:"none",stroke:CY,"stroke-width":2,"stroke-dasharray":"1 7","stroke-linecap":"round"});
const arcLen=1; const arcSolid=mk(fx,"path",{d:arcD,fill:"none",stroke:CY,"stroke-width":2.5,pathLength:1,"stroke-dasharray":"1 1","stroke-dashoffset":1});
const nodes=STAGES.map((_,i)=>{const u=[.12,.31,.5,.69,.88][i]; const [x,y]=ARC(u); const g=mk(fx,"g",{}); mk(g,"line",{x1:x,y1:y+16,x2:nodeX(i),y2:TOP-10,stroke:"#243651","stroke-width":1.5});
  const c=mk(g,"circle",{cx:x,cy:y,r:9,fill:INK,stroke:PALE,"stroke-width":2.5}); const halo=mk(g,"circle",{cx:x,cy:y,r:9,fill:"none",stroke:CY,"stroke-width":2}); return{u,x,y,c,halo,g}});
// re-anchor connector bottoms to card centres
nodes.forEach((n,i)=>{n.g.querySelector("line").setAttribute("x2",nodeX(i))});
const servicer=mk(fx,"g",{}); mkSat(servicer,2.6);
const dockFx=mk(fx,"g",{opacity:0});

function shot(s,href,k,label){const im=mk(s,"image",{href,x:0,y:0,width:270,height:118,preserveAspectRatio:"xMidYMid slice",opacity:clamp(k*2)});im.style.clipPath=`inset(0 ${(100*(1-k)).toFixed(1)}% 0 0)`;mk(s,"rect",{x:.75,y:.75,width:268.5,height:116.5,fill:"none",stroke:"#243651","stroke-width":1.5});mk(s,"text",{x:4,y:112,fill:"#9fb4d8","font-size":12,"font-family":"Mono",opacity:clamp(k*2-1)},label)}
function icons(i,k){const st=STAGES[i], s=st.svg; s.innerHTML="";
 if(st.icon==="prep"){mk(s,"rect",{x:18,y:18,width:80,height:80,rx:4,fill:"none",stroke:"#7aa2ff","stroke-width":2.5});mk(s,"rect",{x:46,y:46,width:24,height:24,fill:AM,opacity:k});
  mk(s,"circle",{cx:150,cy:58,r:8+k*16,fill:"none",stroke:GR,"stroke-width":2.5,opacity:k});mk(s,"circle",{cx:150,cy:58,r:5,fill:GR});
  mk(s,"rect",{x:204,y:32,width:52,height:52,rx:4,fill:"none",stroke:CY,"stroke-width":2.5,opacity:k})}
 if(st.icon==="mc"){[["#ff8f8f",.416,"C0","42%"],[AM,.918,"C1","92%"],[GR,1,"C2","100%"]].forEach(([c,v,l,t],j)=>{const h=70*v*k;mk(s,"rect",{x:34+j*80,y:98-h,width:50,height:h,fill:c});mk(s,"text",{x:59+j*80,y:114,fill:"#9fb4d8","font-size":15,"font-family":"Mono","text-anchor":"middle"},l);mk(s,"text",{x:59+j*80,y:90-h,fill:c,"font-size":15,"font-family":"Mono","text-anchor":"middle",opacity:clamp(k*3-2)},t)})}
 if(st.icon==="ios"){for(let j=0;j<4;j++){const on=k*4>j;mk(s,"circle",{cx:30+j*70,cy:46,r:13,fill:on?CY:"none",stroke:CY,"stroke-width":2.5});if(j)mk(s,"line",{x1:30+(j-1)*70+13,y1:46,x2:30+j*70-13,y2:46,stroke:on?CY:"#243651","stroke-width":2.5})}
  mk(s,"path",{d:"M170,70 Q120,112 40,70",stroke:"#ff8f8f","stroke-width":2.5,fill:"none","stroke-dasharray":"5 6",opacity:k});mk(s,"text",{x:105,y:112,fill:"#ff8f8f","font-size":15,"font-family":"Mono","text-anchor":"middle",opacity:k},"abort from any state")}
 if(st.icon==="ops"){shot(s,"shots/approvals.png",k,"approvals page")}
 if(st.icon==="meas"){shot(s,"shots/fuel.png",k,"fuel gauge")}}

// when the servicer reaches each station (inverts the easing used for its ride), so cards open exactly as it passes
const RIDE0=3.7, RIDE1=7.2, U=u=>0.04+0.92*segIO(u,RIDE0,RIDE1);
const HIT=nodes.map(n=>{let lo=RIDE0,hi=RIDE1;for(let k=0;k<40;k++){const m=(lo+hi)/2;(U(m)<n.u)?lo=m:hi=m}return +((lo+hi)/2-0.05).toFixed(3)});
window.HIT_T=HIT;
// ---------- timeline ----------
const T_END=10;
function render(t){
  // clock
  $("clock").textContent="T+00:"+(Math.min(t,T_END)).toFixed(1).padStart(4,"0");
  $("clock").style.opacity=seg(t,.2,.6);
  stars.forEach(o=>{o.el.setAttribute("r",(o.r*(0.8+0.25*Math.sin(t*1.7+o.p))).toFixed(2));o.el.setAttribute("opacity",(0.25+0.35*Math.sin(t*0.9+o.p*2)**2).toFixed(2))});

  // ---- Act 1: an orbit draws, rides a satellite, contracts into the O of ORBIT (0..1.15)
  const draw=seg(t,0,.6), contract=segIO(t,.55,1.1);
  const bigRx=640, bigRy=210, bigCx=960, bigCy=540;
  const lx=0,ly=0; // lock origin set below
  // lockup placement (3 states)
  const sA={x:(1920-(W+SHIFT-FS*0.045))/2, y:300, k:1}, sB={x:77,y:58,k:0.30}, sC={x:(1920-(W+SHIFT-FS*0.045))/2, y:215, k:1};
  const aB=segIO(t,3.05,3.65), aC=segIO(t,7.55,8.3);
  let px=sA.x+(sB.x-sA.x)*aB, py=sA.y+(sB.y-sA.y)*aB, pk=sA.k+(sB.k-sA.k)*aB;
  px+= (sC.x-sB.x)*aC; py+=(sC.y-sB.y)*aC; pk+=(sC.k-sB.k)*aC;
  lock.setAttribute("transform",`translate(${px.toFixed(2)},${py.toFixed(2)}) scale(${pk.toFixed(4)})`);
  const toW=(lx,ly)=>[px+lx*pk,py+ly*pk];
  // O1 target in world space
  const [t1x,t1y]=toW(o1c.x,o1c.y), r1=(CAP/2-STROKE/2)*pk;
  // fly ring: ellipse -> circle at O1
  const ex=bigCx+(t1x-bigCx)*contract, ey=bigCy+(t1y-bigCy)*contract, erx=bigRx+(r1-bigRx)*contract, ery=bigRy+(r1-bigRy)*contract;
  const rot=-18*(1-contract);
  const showFly=t<1.15;
  flyRing.setAttribute("cx",ex);flyRing.setAttribute("cy",ey);flyRing.setAttribute("rx",Math.max(erx,.1));flyRing.setAttribute("ry",Math.max(ery,.1));flyRing.setAttribute("transform",`rotate(${rot} ${ex} ${ey})`);
  flyRing.setAttribute("stroke-width",2+contract*(STROKE*pk-2));
  flyRing.setAttribute("stroke",contract>.98?PALE:CY);
  // draw-on via dasharray on perimeter approx
  const per=2*Math.PI*Math.sqrt((erx*erx+ery*ery)/2); flyRing.setAttribute("stroke-dasharray",`${(per*draw).toFixed(1)} ${per.toFixed(1)}`);
  flyRing.style.display=showFly?"":"none";
  // satellite on the drawing ring
  const th=-Math.PI/2+ (t*4.6) ; const sx=ex+erx*Math.cos(th), sy=ey+ery*Math.sin(th);
  const rr=rot*Math.PI/180, fx_=ex+(sx-ex)*Math.cos(rr)-(sy-ey)*Math.sin(rr), fy_=ey+(sx-ex)*Math.sin(rr)+(sy-ey)*Math.cos(rr);
  flySat.setAttribute("transform",`translate(${fx_},${fy_}) rotate(${(th*180/Math.PI+90+rot).toFixed(1)}) scale(${(1-contract*0.2)*pk})`);
  flySat.style.display=showFly?"":"none"; flySat.setAttribute("opacity",draw>0.05?1:0);
  // after contraction the real O1 ring takes over, satellite keeps riding it
  const ringOn=t>=1.1; ring1.setAttribute("opacity",ringOn?1:0);
  const th2=-Math.PI/2+t*4.6; sat1.setAttribute("transform",`translate(${(o1c.x+(CAP/2-STROKE/2)*Math.cos(th2)).toFixed(2)},${(o1c.y+(CAP/2-STROKE/2)*Math.sin(th2)).toFixed(2)}) rotate(${(th2*180/Math.PI+90).toFixed(1)}) scale(${0.9})`);
  sat1.setAttribute("opacity",ringOn?1:0);

  // letters of ORBIT unfold from the ring (1.2..2.0); OBSERVERS after the satellite deploys (1.7..2.3)
  letters.forEach((o,i)=>{const line1=i<L1.length; const idx=line1?i:i-L1.length; const a=line1?1.0+idx*0.11:1.5+idx*0.07; const k=seg(t,a,a+.45);
    const slide=(line1?-1:1)*(1-k)*60; o.el.setAttribute("opacity",k); o.el.setAttribute("transform",`translate(${slide.toFixed(1)},0)`); o.el.setAttribute("filter","");
    o.el.setAttribute("fill",PALE)});
  // O2 satellite deploys: body scales in, wings unfold, then rocks and settles
  const dep=seg(t,1.2,1.75), wing=seg(t,1.45,2.0), dock=segIO(t,7.7,8.7);
  const rock=Math.sin(t*2.6)*13*(1-segIO(t,6.2,8.2));                 // tumble that the IOS handover removes
  o2.setAttribute("transform",`translate(${bc.x},${bc.y}) rotate(${rock.toFixed(2)})`);
  o2.setAttribute("opacity",dep); body.setAttribute("transform",`scale(${(0.4+0.6*dep).toFixed(3)})`);
  wings.forEach(({w,sd})=>w.setAttribute("transform",`scale(${wing.toFixed(3)},1)`));

  // ---- Act 2: header + flow (2.4..8.2)
  const hdrK=seg(t,3.5,4.0)*(1-seg(t,7.4,7.8));
  $("hdr").style.left=(77+W*0.30+54)+"px"; $("hdr").style.top="66px"; $("hdr").style.opacity=hdrK;
  const flowA=seg(t,3.5,3.9)*(1-seg(t,7.4,7.8));
  arc.setAttribute("opacity",flowA*0.7);
  const ride=lin(t,RIDE0,RIDE1), arcP=segIO(t,RIDE0,RIDE1);
  arcSolid.setAttribute("stroke-dashoffset",1-arcP); arcSolid.setAttribute("opacity",flowA);
  nodes.forEach((n,i)=>{const hit=t>=3.1+ (n.u-0.0)*(7.6-3.1)*0.0+ (n.u-.12)/(.88-.12)*(4.9-3.55)+3.55-0.0? 0:0;});
  const hitT=i=>HIT[i];
  STAGES.forEach((st,i)=>{const a=hitT(i), k=seg(t,a,a+.75);
    st.el.style.clipPath=`inset(0 ${(100*(1-k)).toFixed(1)}% 0 0)`; st.el.style.opacity=(1-seg(t,7.4,7.9))*(k>0?1:0);
    st.el.style.borderColor=(t>a&&t<a+1.0)?CY:"#243651";
    icons(i,seg(t,a+.2,a+1.1));
    const n=nodes[i]; const pulse=clamp(1-(t-a)/0.9,0,1)*(t>=a?1:0);
    n.g.setAttribute("opacity",flowA); n.c.setAttribute("fill",t>=a?CY:INK); n.halo.setAttribute("r",9+ (1-pulse)*26); n.halo.setAttribute("opacity",t>=a?pulse:0);
  });
  // servicer rides the arc from node 0 to node 4, node hit times follow its position
  const u=0.04+0.92*arcP, [ax,ay]=ARC(u), [bx,by]=ARC(Math.min(1,u+0.01));
  servicer.setAttribute("transform",`translate(${ax},${ay}) rotate(${(Math.atan2(by-ay,bx-ax)*180/Math.PI).toFixed(1)}) scale(1.1)`);
  servicer.setAttribute("opacity",seg(t,3.5,3.9)*(1-seg(t,7.45,7.7)));

  $("cap").style.opacity=seg(t,4.7,5.2)*(1-seg(t,7.4,7.8));

  // ---- Act 3: the lockup returns, the servicer docks to the satellite O, detumble complete (8.0..10)
  // docking servicer flies from the end of the arc to the satellite body top
  const [dxw,dyw]=toW(bc.x,bc.y-CAP/2-STROKE*0.6);
  const [sx0,sy0]=ARC(0.96); const fly=segIO(t,7.55,8.7);
  const ox=sx0+(dxw-sx0)*fly, oy=sy0+(dyw-sy0)*fly - Math.sin(Math.PI*fly)*90;
  // second servicer instance for the dock (reuse dockFx group)
  dockFx.innerHTML=""; const dg=mk(dockFx,"g",{transform:`translate(${ox},${oy}) rotate(${(fly<1?(1-fly)*-70:0).toFixed(1)}) scale(${1.1+0.5*fly})`}); mkSat(dg,2.6);
  dockFx.setAttribute("opacity",seg(t,7.45,7.7));
  // docking confirmation: a thin capture ring + label
  const lock_k=seg(t,8.7,9.1);
  if(lock_k>0){const [cx,cy]=toW(bc.x,bc.y); mk(dockFx,"circle",{cx:cx,cy:cy,r:(CAP/2+30)*pk*(1.15-0.15*lock_k)+8,fill:"none",stroke:GR,"stroke-width":2,opacity:lock_k,"stroke-dasharray":"4 7"});
    mk(dockFx,"text",{x:cx-(CAP/2+WING)*pk,y:cy+(CAP/2+88)*pk,fill:GR,"font-family":"Mono","font-size":20,opacity:lock_k},"terminal window met / 2.0 s hold")}
  $("tag").style.opacity=seg(t,8.8,9.25); $("foot").style.opacity=seg(t,3.6,4.1)*0.9;
}
window.setT=t=>render(t);
document.fonts.ready.then(()=>{window.READY=true;render(0)});
</script></body></html>
